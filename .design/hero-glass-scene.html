<script type="module">
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const q = new URLSearchParams(location.search);
const W = +q.get("w") || 2400, H = +q.get("h") || 1500;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, alpha: false });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = +q.get("exp") || 0.98;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffffff);
const pmrem = new THREE.PMREMGenerator(renderer);
const env = new RoomEnvironment();
const panel = (hex, i, x, y, z, w, h, ry = 0) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(hex).multiplyScalar(i), side: THREE.DoubleSide })); m.position.set(x, y, z); m.rotation.y = ry; env.add(m); };
panel(0x7fe9ff, 16, -7, 3, 2, 1.6, 6, 0.9);
panel(0xc4a8ff, 14, 6, 4, -3, 1.4, 7, -0.8);
panel(0xff9fe4, 13, 2, -2, 6, 5, 1.2, 0);
panel(0xffe9a0, 5, -3, 6, -5, 4, 1.0, 0.3);
scene.environment = pmrem.fromScene(env, 0.035).texture;
scene.environmentIntensity = 1.0;

const camera = new THREE.PerspectiveCamera(30, W / H, 0.1, 100);
camera.position.set(0, 0, 18.5);
camera.lookAt(0, 0, 0);

// ---- ribbon ---------------------------------------------------------------------------------------------------
const U = 700, S = 220;
const pos = new Float32Array((U + 1) * (S + 1) * 3);
const idx = [];
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const lerp = (a, b, t) => a + (b - a) * t;
const P = (u) => {
  // centre line: bottom-left to top-right, one S bend, with depth
  const x = lerp(-13.5, 14.0, u);
  const y = lerp(-8.4, 8.6, u) + 1.9 * Math.sin(u * 4.4 + 0.4) - 1.6 * Math.sin(u * 2.0);
  const z = 2.6 * Math.sin(u * 3.4 + 0.4) + 1.2 * Math.cos(u * 8.0);
  return new THREE.Vector3(x, y, z);
};
const tmpA = new THREE.Vector3(), tmpB = new THREE.Vector3();
for (let i = 0; i <= U; i++) {
  const u = i / U;
  const c = P(u);
  const t = tmpA.copy(P(Math.min(1, u + 0.002))).sub(P(Math.max(0, u - 0.002))).normalize();
  // base cross-direction: in the screen plane, perpendicular to the tangent, then rolled about the tangent
  const side0 = new THREE.Vector3(-t.y, t.x, 0).normalize();
  const up0 = new THREE.Vector3().crossVectors(t, side0).normalize();
  const roll = 0.9 * Math.sin(u * 6.0 + 0.3) + 0.7 * Math.sin(u * 2.3 + 1.7);
  const side = side0.clone().multiplyScalar(Math.cos(roll)).addScaledVector(up0, Math.sin(roll));
  const nrm = new THREE.Vector3().crossVectors(t, side).normalize();
  const width = lerp(3.4, 9.6, smooth(0.0, 0.9, u)) * (1 + 0.14 * Math.sin(u * 8.0 + 1.0));
  for (let j = 0; j <= S; j++) {
    const s = j / S - 0.5;                      // -0.5 .. 0.5 across the ribbon
    const a = s * 2;                            // -1 .. 1
    // soft folds running along the ribbon: low frequency, smooth, with a few sharper pinches
    const f1 = Math.sin(a * 5.2 + u * 9.0 + 0.5);
    const f2 = Math.sin(a * 9.6 - u * 5.0 + 2.1) * 0.5;
    const f3 = Math.pow(Math.abs(Math.sin(a * 3.1 + u * 12.0)), 1.6) * 0.9;
    const edge = 0.5 + 0.5 * Math.cos(a * Math.PI * 0.5);
    const lift = (0.70 * f1 + 0.34 * f2 + 0.46 * f3) * (0.55 + 0.9 * edge) * lerp(0.55, 1.15, u);
    const p = c.clone().addScaledVector(side, s * width).addScaledVector(nrm, lift);
    const k = (i * (S + 1) + j) * 3;
    pos[k] = p.x; pos[k + 1] = p.y; pos[k + 2] = p.z;
  }
}
for (let i = 0; i < U; i++) for (let j = 0; j < S; j++) {
  const a = i * (S + 1) + j, b = a + 1, c = a + (S + 1), d = c + 1;
  idx.push(a, b, c, b, d, c);
}
const geo = new THREE.BufferGeometry();
geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
geo.setIndex(idx);
geo.computeVertexNormals();

const mat = new THREE.MeshPhysicalMaterial({
  color: new THREE.Color(0xc9d2e3),
  metalness: 0.8, roughness: 0.12,
  clearcoat: 1.0, clearcoatRoughness: 0.06,
  iridescence: 1.0, iridescenceIOR: 2.0, iridescenceThicknessRange: [320, 1150],
  sheen: 0.4, sheenColor: new THREE.Color(0xdde8ff), sheenRoughness: 0.4,
  envMapIntensity: 1.35, side: THREE.DoubleSide,
});
mat.onBeforeCompile = (sh) => {
  sh.fragmentShader = sh.fragmentShader.replace("#include <opaque_fragment>", `
    vec3 Vv = normalize(vViewPosition);
    float ndv = clamp(abs(dot(normalize(vNormal), Vv)), 0.0, 1.0);
    float ph = ndv * 2.2 + vViewPosition.x * 0.012;
    vec3 film = 0.5 + 0.5 * cos(6.28318 * (vec3(1.0) * ph + vec3(0.0, 0.33, 0.67)));
    film = mix(vec3(0.78, 0.94, 1.0), film, 0.8);
    float rim = pow(1.0 - ndv, 1.7);
    outgoingLight = mix(outgoingLight, outgoingLight * (0.78 + 0.5 * film) + film * 0.10, clamp(rim * 1.5 + 0.2, 0.0, 0.92));
    #include <opaque_fragment>`);
};
const mesh = new THREE.Mesh(geo, mat);
mesh.rotation.z = +q.get("rz") || 0;
mesh.position.set(+q.get("px") || 0, +q.get("py") || 0, 0);
mesh.scale.setScalar(+q.get("sc") || 1);
scene.add(mesh);

// ---- glitter ---------------------------------------------------------------------------------------------------
const NS = 420, sp = new Float32Array(NS * 3);
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
for (let n = 0; n < NS; n++) {
  const u = rnd(); const c = P(u); const sdev = (rnd() - 0.5) * lerp(5, 12, u);
  sp[n * 3] = c.x + (rnd() - 0.5) * 4 + sdev * 0.3; sp[n * 3 + 1] = c.y + sdev * 0.9; sp[n * 3 + 2] = c.z + 1.0 + rnd() * 2.0;
}
const sg = new THREE.BufferGeometry(); sg.setAttribute("position", new THREE.BufferAttribute(sp, 3));
const sm = new THREE.PointsMaterial({ color: 0xffffff, size: 0.045, sizeAttenuation: true, transparent: true, opacity: 0.9, depthWrite: false });
const pts = new THREE.Points(sg, sm); scene.add(pts);

renderer.render(scene, camera);
window.__done = true;
